name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke test core routes
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/tilemart-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          ready=0
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/tilemart-next.log
            exit 1
          fi

          for route in \
            / \
            /tiles \
            /tiles/floor-tiles \
            /tiles/wall-tiles \
            /tiles/bathroom-tiles \
            /tiles/kitchen-tiles \
            /sanitary-ware \
            /about \
            /showroom \
            /contact \
            /robots.txt \
            /sitemap.xml; do
            echo "Checking $route"
            curl --silent --show-error --fail "http://127.0.0.1:3000$route" > /dev/null
          done
